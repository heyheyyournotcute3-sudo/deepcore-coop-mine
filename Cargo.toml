[workspace]
resolver = "3"
members = [
    "crates/shared",
    "crates/server",
    "crates/client",
    "crates/lobby",
    "tools/atlas_gen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/heyheyyournotcute3-sudo/deepcore-coop-mine"

[workspace.dependencies]
# internal crates
# --- engine -------------------------------------------------------------
bevy = { version = "0.20.1", default-features = false, features = [
    "3d",
    "ui",
    "audio",
    "png",
    "multi_threaded",
    "x11",
    "wayland",
    "default_font",
    "sysinfo_plugin",
] }
bevy_replicon = "0.45.5"
bevy_replicon_renet = "0.21.0"
bevy_egui = "0.43.1"
renet = "2.0"

# --- data ---------------------------------------------------------------
serde = { version = "1.0.228", features = ["derive"] }
ron = "0.12"
postcard = { version = "1.1", features = ["alloc"] }
zstd = "0.13"
noise = "0.9"
rand = "0.9"
rand_chacha = "0.9"

# --- infra --------------------------------------------------------------
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
hashbrown = "0.16"

# --- persistence / services (M9, M10) -----------------------------------
rusqlite = { version = "0.37", features = ["bundled"] }
axum = "0.8"
# sqlx 0.9 links libsqlite3-sys 0.37, matching rusqlite 0.37, so both can coexist.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "chrono",
] }
argon2 = "0.5"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "signal"] }

# --- dev ----------------------------------------------------------------
proptest = "1.9"

# internal crates
deepcore-shared = { path = "crates/shared" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
